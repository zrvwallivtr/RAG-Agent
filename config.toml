[models]

ollama_host = "http://localhost:11434"

model     = "ministral-3:3b"
embedding = "nomic-embed-text"

# Optional token limits
# model_max_tokens      =
# embedding_max_tokens  =

fallback_tokenizer  = "gpt2"


[file_reader]

retrieve_entry_limit                        = 3
enable_auto_read_dropbox                    = true
enable_docling                              = true
